{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search — Waypoint</title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>

<body>

    <header class="site-header">

        <nav class="navbar">

            <a href="{% url 'home' %}" class="logo">
                Waypoint
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'report' %}">
                    Report a Trail
                </a>

                <a href="{% url 'search' %}">
                    Search
                </a>

            </div>

        </nav>

    </header>


    <main class="page-container">

        <section class="search-card">

            <p class="eyebrow">
                Explore Waypoint
            </p>

            <h1>
                Search Trails
            </h1>

            <form
                method="GET"
                action="{% url 'search' %}"
                class="search-form"
            >

                <input
                    type="search"
                    name="q"
                    value="{{ query }}"
                    placeholder="Search for a trail..."
                >

                <button
                    type="submit"
                    class="button"
                >
                    Search
                </button>

            </form>


            {% if query %}

                <div class="search-result">

                    <p>
                        You searched for:
                    </p>

                    <strong>
                        {{ query }}
                    </strong>

                </div>

            {% else %}

                <p class="empty-state">
                    Enter a trail name to start searching.
                </p>

            {% endif %}

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 Waypoint.
        </p>

    </footer>

</body>

</html>
