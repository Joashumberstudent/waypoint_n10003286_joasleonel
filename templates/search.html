{% extends "base.html" %}

{% block title %}Search — Waypoint{% endblock %}

{% block content %}

<section class="page-section">

    <h1>Search Trails</h1>

    <form method="get" action="{% url 'search' %}" class="search-form">
        <input
            type="text"
            name="q"
            value="{{ query }}"
            placeholder="Search for a trail..."
        >

        <button type="submit" class="btn">
            Search
        </button>
    </form>

    {% if query %}
        <p>
            Search results for:
            <strong>{{ query }}</strong>
        </p>
    {% else %}
        <p>Enter a search term to find trails.</p>
    {% endif %}

</section>

{% endblock %}
