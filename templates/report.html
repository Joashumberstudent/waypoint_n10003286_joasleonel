{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report a trail — Waypoint</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    {% if submitted %}
        <h1>Thanks, {{ name }}!</h1>
        <p>Your report for "{{ trail }}" has been received.</p>
        {% if note %}<p>Note: {{ note }}</p>{% endif %}
        <a href="{% url 'home' %}">Back home</a>
    {% else %}
        <h1>Report a trail</h1>
        <form method="post">
            {% csrf_token %}
            <label>Name
                <input type="text" name="name" required>
            </label>
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>Trail
                <input type="text" name="trail" required>
            </label>
            <label>Note
                <textarea name="note"></textarea>
            </label>
            <button type="submit">Submit report</button>
        </form>
    {% endif %}
</body>
</html>
