{% extends "base.html" %}

{% block title %}Report a Trail — Waypoint{% endblock %}

{% block content %}

<section class="page-section">

    <h1>Report a Trail</h1>

    <form method="post" class="report-form">

        {% csrf_token %}

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="trail">Trail</label>
            <input
                type="text"
                id="trail"
                name="trail"
                required
            >
        </div>

        <div class="form-group">
            <label for="note">Note</label>
            <textarea
                id="note"
                name="note"
                rows="5"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn">
            Submit Report
        </button>

    </form>

</section>

{% endblock %}
