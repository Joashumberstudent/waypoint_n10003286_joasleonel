{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report a Trail — Waypoint</title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>

<body>

    <header class="site-header">

        <nav class="navbar">

            <a href="{% url 'home' %}" class="logo">
                Waypoint
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'report' %}">
                    Report a Trail
                </a>

            </div>

        </nav>

    </header>


    <main class="page-container">

        <section class="form-card">

            <div class="form-header">

                <p class="eyebrow">
                    Help improve Waypoint
                </p>

                <h1>
                    Report a Trail
                </h1>

                <p>
                    Tell us about a trail that needs
                    to be added or updated.
                </p>

            </div>


            <form
                method="POST"
                action="{% url 'report' %}"
                class="trail-form"
            >

                <!-- WP-403 -->
                {% csrf_token %}


                <div class="form-group">

                    <label for="name">
                        Your name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="trail">
                        Trail name
                    </label>

                    <input
                        type="text"
                        id="trail"
                        name="trail"
                        placeholder="Enter the trail name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="note">
                        Report details
                    </label>

                    <textarea
                        id="note"
                        name="note"
                        rows="6"
                        placeholder="Tell us what you noticed..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="button"
                >
                    Submit Report
                </button>

            </form>

        </section>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 Waypoint.
        </p>

    </footer>

</body>

</html>
