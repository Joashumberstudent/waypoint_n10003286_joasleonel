{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Waypoint</title>

    <!-- WP-402 -->
    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >
</head>

<body>

    <header class="site-header">

        <nav class="navbar">

            <a href="{% url 'home' %}" class="logo">
                Waypoint
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'report' %}">
                    Report a Trail
                </a>

                <a href="{% url 'search' %}">
                    Search
                </a>

            </div>

        </nav>

    </header>


    <main class="hero">

        <div class="hero-content">

            <p class="eyebrow">
                Explore. Discover. Report.
            </p>

            <h1>
                {{ greeting }}
            </h1>

            <p class="hero-text">
                Discover trails, explore new routes,
                and help the community keep trail
                information up to date.
            </p>

            <div class="hero-actions">

                <a
                    href="{% url 'report' %}"
                    class="button"
                >
                    Report a Trail
                </a>

                <a
                    href="{% url 'search' %}"
                    class="button button-secondary"
                >
                    Search Trails
                </a>

            </div>

        </div>

    </main>


    <footer class="footer">

        <p>
            &copy; 2026 Waypoint.
            Built for trail explorers.
        </p>

    </footer>

</body>

</html>
