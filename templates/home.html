{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waypoint | Trail Planner</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <nav>
        <a href="{% url 'report' %}">Report a Trail</a>
        <a href="{% url 'search' %}">Search Trails</a>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <span class="eyebrow">EXPLORE • PLAN • DISCOVER</span>

            <h1>Welcome, {{ greeting_name }}!</h1>

            <p>
                Plan your next adventure, discover new trails,
                and keep track of every journey with Waypoint.
            </p>

            <div class="hero-actions">
                <a class="primary-btn" href="{% url 'search' %}">
                    Explore Trails →
                </a>

                <a class="secondary-btn" href="{% url 'report' %}">
                    Report a Trail
                </a>
            </div>
        </div>
    </main>

</body>
</html>
